name: Real Estate Institute of Australia
kind: company
description: >-
  The Real Estate Institute of Australia (REIA), founded in 1924 and based in Canberra, is the national
  federation of the eight state and territory Real Estate Institutes (REINSW, REIV, REIQ, REIWA, REISA,
  REIT, REIACT, REINT), which between them represent roughly 85% of Australian real estate businesses and
  agents. REIA is a policy, research and accreditation body, not an operator of market infrastructure: it
  administers the REIA National Principles of Conduct that underpin state institute codes and training,
  awards Associate (AREI) and Fellow accreditations, runs the Australasian Auctioneering Championships
  (AUSTROS) jointly with REINZ and the National Awards for Excellence (NAFE), makes submissions to the
  Commonwealth Government, and publishes the quarterly Housing Affordability Report (HAR) and Real Estate
  Market Facts (REMF) series that Federal Treasury, the Reserve Bank, state treasuries and investment banks
  subscribe to. It sits well above the transaction rail in the Australian value chain - listings run
  through REA Group's realestate.com.au and Domain, settlement through PEXA, valuation through PropTrack
  and CoreLogic, and title through the state land registries - and REIA touches none of those pipes. Its
  API posture is therefore an honest absence: no developer portal, no API subdomain, no OpenAPI or OData
  contract, and no RESO reference anywhere on its estate, because RESO is a NAR-mandated United States
  construct with no Australian counterpart. What REIA sells is data, not access to it - the HAR and REMF
  reports are AUD 450 subscriptions and each of the 7 HAR and 15 REMF underlying datasets is a separate
  AUD 280 subscription, delivered as documents through a platformOS/Insites ecommerce storefront with
  Stripe checkout behind an email-and-password account. Policy submissions, standalone research reports and
  the strategic plan are freely downloadable PDFs; the quarterly numbers are not, and there is no open data.
