absences:
  api: >-
    Total. REIA publishes no API. This is not a gated API - it is the absence of one.
  webhooks: None. No callback, event or subscription surface of any kind.
  sdks: None. No client libraries, no GitHub organisation.
  postman: None.
  graphql: None found.
  mcp: None found.
  statusPage: None found.
  changelog: None published.
  securityTxt: Absent - /.well-known/security.txt returns 404.
  vulnerabilityDisclosure: None published.
  rateLimits: Not applicable - no API.
  pricing: >-
    Published, but for DATA rather than API access - HAR AUD 450, REMF AUD 450, and AUD 280 per dataset
    across 7 HAR datasets and 15 REMF datasets, listed openly on /research/har and /research/remf.

organisationFacts:
  founded: 1924
  headquarters: Canberra, Australian Capital Territory, Australia
  structure: >-
    Federation. Members are the state and territory Real Estate Institutes - REIACT, REINSW, REINT, REISA,
    REIT, REIV, REIWA - which REIA states represent 85% of all Australian real estate businesses and
    agents. Board is composed of state and territory representatives; a small executive team is based in
    Canberra.
  programmes:
  - REIA National Principles of Conduct
  - Associate (AREI) and Fellow accreditation
  - Australasian Auctioneering Championships (AUSTROS) and Australasian Novice Auctioneering Championships (ANAC), run jointly with REINZ
  - National Awards for Excellence (NAFE)
  - Housing Affordability Report (HAR), quarterly
  - Real Estate Market Facts (REMF), quarterly
  - Government submissions and advocacy, including AML/CTF Tranche 2 readiness for the 1 July 2026 commencement
  alliances:
  - Real Estate Institute of New Zealand (REINZ)
  - FIABCI (Paris-based international property federation; REIA is the Australian chapter)
  - National Association of REALTORS (NAR), United States, plus a relationship with the California Association of REALTORS
  - Australian Sustainable Built Environment Council (ASBEC)
  partners:
  - REI Super
  - First AML
  technologyStack: >-
    platformOS (Sydney instance 699) with the Insites CMS and ecommerce modules, built by Combinate, with
    Stripe for payments. Assets are served from uploads.prod01.sydney.platformos.com and, for some
    accreditation and AML PDFs, cdn.staging.oregon.platform-os.com.

findings:
  summary: >-
    REIA is the Australian control case for this sector study's central question, and it answers it by
    absence. The United States has a mandated machine-readable contract because an industry body, NAR,
    imposed RESO on the MLSs it governs. Australia's national industry body imposes nothing of the kind:
    REIA is a federation of state institutes that writes conduct principles, awards accreditations, runs
    awards and auctioneering competitions, and publishes quarterly housing research. It does not sit on the
    transaction rail. Australia's genuinely machine-readable property infrastructure exists - PEXA is the
    closest thing in this whole study to a required national electronic settlement rail, listings are
    duopolised by REA Group and Domain, valuation by PropTrack and CoreLogic - but every one of those rails
    is commercial and none of them answers to REIA. The result is a 19-page site with zero developer
    surface, zero RESO footprint, and a paywall around the one dataset REIA genuinely owns. The distinction
    the study cares about lands cleanly here: there is no certification to confuse with reachability,
    because there is neither. What a would-be consumer of REIA data actually does is create an account,
    accept terms that forbid redistribution, pay AUD 280 to AUD 450, and download a document.
  statusCall: built-stub
  statusRationale: >-
    Identity only. No API, no developer portal, no machine-readable contract, and no open data were found
    after exhaustive probing of the full 19-URL sitemap, four developer subdomain patterns on two domains,
    eleven contract paths, four well-known paths and three feed paths. apis[] is correctly empty. The
    research subscription storefront is a paid document product behind an account, not a developer surface.

