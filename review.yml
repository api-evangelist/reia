aid: reia
name: Real Estate Institute of Australia
slug: reia
homeMarket: Australia
tier: industry-body
reviewer: API Evangelist
reviewed: '2026-07-26'

review:
  question: >-
    Does the Real Estate Institute of Australia publish a reachable, documented public API surface, and
    what is its RESO posture as the national industry body for Australian real estate?
  answer: >-
    No. REIA publishes no API of any kind. Its entire public estate is a 19-page platformOS/Insites
    marketing and ecommerce site at www.reia.com.au (reia.asn.au 301-redirects to it). Every developer
    subdomain probed fails to resolve, every contract path returns 404, and there is no OpenAPI, Swagger,
    OData $metadata, GraphQL, webhook, SDK or Postman artifact anywhere on the estate. RESO does not appear
    once across any page of the site, and REIA holds no RESO certification - RESO is a NAR-mandated United
    States construct and has no Australian counterpart. What REIA sells is the DATA, as paid document
    subscriptions, not machine access to it.
  date: '2026-07-26'

sectorPosture:
  resoPosture: >-
    No RESO reference found. RESO is absent from Australia. All 19 pages of www.reia.com.au were fetched
    and grepped for "RESO", "Data Dictionary", "Web API", "OData", "$metadata", "UPI", "REAXML" and
    "IDX": zero hits (the only matches for the substring were the English word "resource" and CSS/JS
    tokens containing "api"). The public RESO certificate directory at https://www.reso.org/certificates/
    (HTTP 200, fetched 2026-07-26, 416,233 bytes) was fetched and grepped for "Australia", "Australian",
    "REIA" and ".au": zero hits - no Australian organisation appears in the RESO certificate directory at
    all. https://www.reso.org/certification/ (HTTP 200) likewise names no Australian certificand. REIA
    does have a documented institutional relationship with NAR - NAR is listed as an alliance on
    https://www.reia.com.au/our-network alongside REINZ, FIABCI and ASBEC, and REIA notes a further
    relationship with the California Association of REALTORS - but that alliance carries no standards
    obligation into Australia. Australia's machine-readable property rails sit outside REIA entirely:
    listing syndication runs through REA Group's realestate.com.au and Domain, electronic conveyancing
    through PEXA, valuation through PropTrack and CoreLogic, and title through the state land registries.
    REIA publishes conduct principles and accreditation criteria, not a data standard.
  resoCertified: false
  resoCertifiedEvidence: >-
    Defensible on two independent probes. (1) The public RESO certificate directory
    (https://www.reso.org/certificates/, HTTP 200) contains no entry for the Real Estate Institute of
    Australia, for any Australian state institute, or for any Australian organisation. (2) REIA's own site
    never mentions RESO, the RESO Data Dictionary, the RESO Web API or the Universal Property/Parcel
    Identifier. REIA operates no MLS and no listing database, so there is nothing for it to certify.
  resoArtifactsProbed:
  - url: https://www.reso.org/certificates/
    status: 200
    note: >-
      Public certificate directory, 416,233 bytes, fetched anonymously. Zero occurrences of Australia,
      Australian, REIA, or the .au TLD.
  - url: https://www.reso.org/certification/
    status: 200
    note: Public certification programme page. No Australian certificand named.
  - url: https://certification.reso.org/
    status: 400
    note: RESO Analytics bare host returns 400; per-certificate summaries are linked from reso.org/certificates.
  - url: https://www.reia.com.au/Reso
    status: 404
    note: No RESO landing page on the REIA estate.
  - url: https://www.reia.com.au/odata
    status: 404
  - url: https://www.reia.com.au/$metadata
    status: 404
    note: No OData service document or EDMX metadata is served anywhere on the REIA estate.
  universalPropertyIdentifier:
    found: false
    note: >-
      No UPI, no Universal Parcel Identifier, and no Australian equivalent parcel identifier scheme is
      published by REIA. Australian parcel identity lives with the state land registries and with PEXA's
      conveyancing workflow, neither of which REIA operates or documents.
  standardsPublished:
  - name: REIA National Principles of Conduct
    url: https://www.reia.com.au/conduct
    freelyDownloadable: false
    note: >-
      The principles are summarised in prose on the /conduct page (agents must act in clients' best
      interests and act ethically, fairly and honestly with all parties), and REIA states it also applies
      FIABCI's International Code of Ethics as the Australian chapter of FIABCI. The only linked PDF of the
      document itself, https://reia.com.au/wp-content/uploads/2024/07/Principles-of-Conduct-2012.pdf, is a
      dead link from the previous WordPress site and returns HTTP 404. The standard REIA administers is
      therefore currently NOT downloadable in full from its own site - the summary is public, the document
      is not reachable.
  - name: REIA Associate (AREI) and Fellow accreditation criteria
    url: https://www.reia.com.au/accredit
    freelyDownloadable: true
    note: >-
      Criteria and application forms are public PDFs on the Insites CDN (criteria_for_1_associateship.pdf,
      criteria_for_fellowship.pdf, apply_for_associateship.pdf, apply_for_fellowship.pdf). Applications are
      emailed to reia@reia.com.au, must be endorsed by the applicant's state or territory institute (which
      requires being a member of it) and approved by REIA. Application fee AUD 300 + GST for Associate,
      AUD 850 + GST for Fellow, payable only on approval; the cycle runs roughly a full business quarter.
  certificationDirectory:
    published: false
    note: >-
      REIA publishes no public directory of who holds AREI or Fellow accreditation, and no directory of
      accredited agents or agencies. There is nothing analogous to the RESO certificate directory. Agent
      licensing in Australia is a state and territory regulator function, and REIA directs consumer
      complaints to those regulators rather than handling them itself.

accessGate:
  classification: membership-required
  whatADeveloperMustSignOrJoin: >-
    Nothing a developer signs gets them an API, because there is no API. Three separate gates exist and
    none of them is a developer gate. (1) DATA: the quarterly research is sold as subscriptions through the
    site's platformOS ecommerce module with Stripe checkout - HAR AUD 450 and REMF AUD 450 for the flagship
    reports, plus AUD 280 each for the 7 HAR datasets and the 15 REMF datasets. A buyer creates an account
    at https://www.reia.com.au/create-account (email, personal details, company details) and accepts the
    REIA Website Terms and Conditions, whose clause 6 states all content is owned by REIA and "You may not
    reproduce, distribute, or resell any content without written permission. Use of data in any way must be
    referenced to the Real Estate Institute of Australia." Subscriptions bill in advance in AUD including
    GST and auto-renew. That account unlocks documents, not endpoints. (2) MEMBERSHIP: REIA's members are
    the eight state and territory institutes, not individuals - an agent joins their state REI, and REI
    membership requires accepting the Code of Conduct. (3) ACCREDITATION: AREI and Fellowship both require
    existing state institute membership plus state endorsement plus REIA board approval plus a fee.
    Affiliate Membership for major real estate networks is by invitation of the REIA Board only, with
    expressions of interest emailed to the REIA President.
  gated: true
  selfServePortal: false
  selfServePortalNote: >-
    https://www.reia.com.au/sign-in is a subscriber login for purchased reports and datasets. Its form
    POSTs to /api/sessions, which is the platformOS session endpoint for the site itself (GET returns 404,
    text/html); it is CMS plumbing, not a documented developer API, and it is not listed in apis.yml.

openData:
  exists: false
  note: >-
    No open data. The Australian counterweight in this sector is government-side (ABS, state land
    registries, data.gov.au), not REIA. REIA's quarterly HAR and REMF series - which run back to 1982 and
    are subscribed to by Federal Treasury, the Reserve Bank, all state and territory treasuries, investment
    banks and consultancies - are paid, licensed, document-delivered products. What IS freely downloadable
    without an account, confirmed HTTP 200 and application/pdf, is REIA's advocacy and narrative output:
    policy submissions (Pre-budget Submission 26/27, AML/CTF rules submissions, Registry Stabilisation and
    Uplift, NatHERS, CGT discount, Federal Election Guide) at /submissions, standalone research reports
    (Build to Rent, Property Management Action Plan, CRE EOFY Economic Outlook, CRE Sustainability 2023) at
    /standalone-research, the REIA Strategic Plan 2026-28, and First AML/REIA AML fact sheets. All are PDFs.
    None is machine-readable, none is an API, and none carries an open licence.

authModel:
  scheme: >-
    Email and password against the site's own platformOS/Insites account system. No API authentication
    scheme exists because no API exists.
  apiKeys: false
  oauth: false
  openidConnect:
    probed:
    - url: https://www.reia.com.au/.well-known/openid-configuration
      status: 404
    found: false
    note: No OIDC discovery document is served anonymously. No SAML or SSO federation is advertised.
  sso: >-
    None published. The word "sso" appears only as a CSS/asset token in the sign-in page markup, not as an
    identity federation offering.
  payments: >-
    Stripe, referenced in the platformOS ecommerce module assets on the research pages. Cart and checkout
    are first-party site features, not an exposed API.

